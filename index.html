
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Spectre Clicker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #08091a;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .font-game {
            font-family: 'Orbitron', sans-serif;
        }
        
        /* The Idle Spectral Breathe */
        @keyframes spectral-breathe {
            0%, 100% { 
                transform: translateY(0) scale(1) rotate(0deg); 
                filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.4));
            }
            33% { 
                transform: translateY(-12px) scale(1.02) rotate(1deg);
                filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.5));
            }
            66% { 
                transform: translateY(-5px) scale(0.98) rotate(-1deg);
                filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3));
            }
        }
        
        /* The Glitchy Flicker */
        @keyframes spectral-flicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% {
                opacity: 1;
                filter: brightness(1);
            }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% {
                opacity: 0.7;
                filter: brightness(1.5) contrast(1.2);
            }
        }

        .animate-spectral-breathe {
            animation: spectral-breathe 4s ease-in-out infinite;
        }
        
        .animate-spectral-flicker {
            animation: spectral-flicker 5s linear infinite;
        }

        .ghost-glow {
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.4));
        }
        
        .boost-active-ghost {
            filter: drop-shadow(0 0 30px rgba(251, 146, 60, 0.6));
            animation: vibrate 0.2s infinite, spectral-flicker 1s linear infinite;
        }
        
        @keyframes vibrate {
            0% { transform: translate(0,0) rotate(0); }
            25% { transform: translate(2px, 2px) rotate(1deg); }
            50% { transform: translate(-2px, -2px) rotate(-1deg); }
            75% { transform: translate(2px, -2px) rotate(1deg); }
            100% { transform: translate(0,0) rotate(0); }
        }
        
        .boost-active {
            animation: pulse-border-ghost 1.5s infinite;
        }
        
        @keyframes pulse-border-ghost {
            0% { box-shadow: 0 0 0 0 rgba(251, 146, 60, 0.7); }
            70% { box-shadow: 0 0 0 25px rgba(251, 146, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 146, 60, 0); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
